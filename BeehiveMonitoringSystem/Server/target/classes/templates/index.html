<!DOCTYPE html>
<html>
<head>
    <title>Honey Production</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        #myChart {
            max-width: 300px;
            max-height: 200px;
        }
    </style>
</head>
<body>
<div>Beehive: B42</div>
<hr>
<div style="display: flex;">
    <canvas id="myChart" width="300" height="200"></canvas>
    <ul style="border-left: 1px black solid; padding-left: 15px; display: flex; flex-direction: column; justify-content: space-between; margin: 40px 20px;">
        <li style="font-family:Arial, Helvetica, sans-serif; font-size:8px; font-weight:700;">Current humidity: 0.55 %</li>
        <li style="font-family:Arial, Helvetica, sans-serif; font-size:8px; font-weight:700;">Current temperature: 37 °C</li>
        <li style="font-family:Arial, Helvetica, sans-serif; font-size:8px; font-weight:700;">Current weight: 44 kg</li>
    </ul>
</div>



</body>
</html>
<script>
    var ctx = document.getElementById('myChart').getContext('2d');
    var myChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: ['Mars', 'April', 'May', 'June', 'July', 'August'],
            datasets: [{
                label: 'Honungsproduktion (kg)',
                data: [5, 8, 14, 22, 33, 44], // Minskning i juni från 60 till 50 kg
                backgroundColor: 'rgba(255, 206, 86, 0.2)',
                borderColor: 'rgba(255, 206, 86, 1)',
                borderWidth: 1
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true,
                    min: 0,
                    max: 50,
                }
            }
        }
    });
</script>
