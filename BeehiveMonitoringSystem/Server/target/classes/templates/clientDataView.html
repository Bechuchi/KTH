<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Client Data</title>
</head>
<body>
    <h1>Client Messages</h1>
    <table border="1">
        <tr>
            <th>MAC Address</th>
            <th>Weight Values</th>
        </tr>
        <tr th:each="message : ${beehiveDataList}">
            <td th:text="${message.MACaddress}">MAC Address</td>
            <td th:text="${message.weightValuesAsString}">Weight Values</td>
        </tr>
    </table>
</body>
</html>
