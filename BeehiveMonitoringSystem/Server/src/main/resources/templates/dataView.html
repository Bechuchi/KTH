<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Beehive Data</title>
    <style>
        table {
            width: 50%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h2>Latest 10 Days of Weight Data</h2>
    
    <table border="1">
        <!-- Loopa över bikuporna -->
        <tr th:each="entry, iterStat : ${beehiveData}" 
            th:with="currentBeehive=${entry.value[0]}">
            
            <td th:text="${iterStat.count}"></td>
            <td><strong>Bikupa:</strong> <span th:text="${entry.key}"></span></td>
            
            <!-- Visa linjediagram -->
            <td>
                <canvas th:id="'chart-' + ${iterStat.count}" width="200" height="100"></canvas>
                
                <!-- Konvertera viktvärden till JSON och skicka till JavaScript -->
                <script th:inline="javascript">
                    /*<![CDATA[*/
                    var weightValues = /*[[${currentBeehive.weightValues}]]*/ [];
                    var ctx = document.getElementById("chart-" + /*[[${iterStat.count}]]*/ "").getContext('2d');
                    new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: Array.from({length: weightValues.length}, (_, i) => i + 1), // Skapa etiketter
                            datasets: [{
                                label: "Weight",
                                data: weightValues,
                                borderColor: "blue",
                                fill: false
                            }]
                        },
                        options: {
                            responsive: false,
                            maintainAspectRatio: false,
                            scales: {
                                y: { beginAtZero: false }
                            }
                        }
                    });
                    /*]]>*/
                </script>
            </td>
        </tr>
    </table>    

</body>
</html>
