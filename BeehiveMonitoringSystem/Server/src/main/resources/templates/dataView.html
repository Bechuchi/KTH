<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beehive Data</title>
</head>
<body>
    <h2>Latest 10 Days of Weight Data</h2>
    <table border="1">
        <tr>
            <th>Day</th>
            <th>Weight (kg)</th>
        </tr>
        <tr th:each="weight, iterStat : ${weightData}">
            <td th:text="${iterStat.count}"></td>
            <td th:text="${weight}"></td>
        </tr>
    </table>
</body>
</html>
