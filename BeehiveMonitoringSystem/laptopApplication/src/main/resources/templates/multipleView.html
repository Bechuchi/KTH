<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Honey Production</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .chart-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-items: center;
        }
        canvas {
            max-width: 400px;
            max-height: 300px;
            margin: 20px;
        }
    </style>
</head>
<body>
<h2 style="text-align: center;">Beehive Data</h2>
<hr>
<div class="chart-container">
    <!-- Loop över alla bikupor och skapa ett diagram för varje -->
    <div th:each="beehive, iterStat : ${beehivesData}">
        <div style="text-align:center;">
            <h3>Beehive [[${beehive.ipAddress}]]</h3>
        </div>
        <canvas th:attr="id='chart' + ${iterStat.index}" width="400" height="300"></canvas>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    // Logga datan så vi vet vad som finns där
    var beehivesData = /*[[${beehivesData}]]*/ '[]';
    console.log('Beehives data:', beehivesData);
    
    // Kontrollera att beehivesData finns och skapa ett diagram för varje bikupa
    for (var i = 0; i < beehivesData.length; i++) {
        var beehive = beehivesData[i];        
    
        var ctx = document.getElementById('chart' + i).getContext('2d');
        var myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Mars', 'April', 'May', 'June', 'July', 'August'],
                datasets: [{
                    label: 'Beehive ' + beehive.ipAddress + ' (kg)',
                    data: weights,
                    backgroundColor: 'rgba(255, 206, 86, 0.2)',
                    borderColor: 'rgba(255, 206, 86, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true,
                        min: 0,
                        max: 50
                    }
                }
            }
        });
    }
</script>    
</body>
</html>
